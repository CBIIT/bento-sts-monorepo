name: Build Images for STS
permissions:
  contents: write
  id-token: write

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Which account the ECR repository is in'
        type: choice
        default: ECR-cbiit-cloudone
        options:
          - fnl-leidos
          - ECR-cbiit-cloudone
      #build:
        #description: build docker images
        #required: true
        #type: boolean
        #default: true
      trivy_scan:
        description: "Run Trivy Scan"
        required: true
        type: boolean
        default: true
      twistlock_scan:
        description: "Run Twistlock Scan"
        required: true
        type: boolean
        default: true
      twistlock_address:
        description: "Optional Twistlock console URL for Prefect params"
        required: false
        default: ""
        type: string
      neo4j_version:
        description: "Neo4j Docker image tag to mirror into ECR"
        required: true
        default: "4.4.44-community"
        type: string
run-name: "Build to ${{ inputs.environment }} (Trivy: ${{ inputs.trivy_scan }}, Twistlock: ${{ inputs.twistlock_scan }})"

jobs:

  # ──────────────────────────────────────────────
  # Job 1: Compute the image tag once, share it
  # ──────────────────────────────────────────────
  prepare:
    name: Prepare Image Tag
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.set_tag.outputs.image_tag }}
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          submodules: recursive
          clean: true
          fetch-depth: 0

      - name: Extract branch name and set image tag
        id: set_tag
        run: |
          BRANCH_NAME=${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}
          echo "Current branch is: $BRANCH_NAME"
          git fetch --tags --force --quiet
          #tag=$(git tag -l $BRANCH_NAME* | sort -V | tail -1)
          tag=$(git ls-remote --tags origin "$BRANCH_NAME.*" \
            | awk '{print $2}' \
            | sed 's|refs/tags/||' \
            | sort -V \
            | tail -1)
          echo "Latest git tag: $tag" 
          if [ ! -z "$tag" ]; then
            build_num=$(echo "${tag##*.}")
            build_num=$((build_num+1))
          else
            build_num=1
          fi
          IMAGE_TAG="$BRANCH_NAME.$build_num"
          echo "IMAGE_TAG=$IMAGE_TAG"

          # Tag the commit immediately so the next run always sees it, even if the build fails
          git config user.name "GitHub Actions"
          git config user.email "github-actions@users.noreply.github.com"
          git tag $IMAGE_TAG
          git push origin $IMAGE_TAG

          echo "image_tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"

  # ──────────────────────────────────────────────
  # Job 2: Build + Trivy scan + Push each image in parallel
  # ──────────────────────────────────────────────
  build:
    name: Build, Scan and Push - ${{ matrix.name }}
    runs-on: ubuntu-latest
    needs: prepare
    environment: ${{ inputs.environment }}
    env:
      IMAGE_TAG: ${{ needs.prepare.outputs.image_tag }}
      REGION: "us-east-1"
    strategy:
      fail-fast: false   # let all matrix jobs run even if one fails
      matrix:
        include:
          - name: backend
            ecr_repo: crdc-mdb-sts-fast-api
            dockerfile: backend/Dockerfile
            context: backend
          #- name: frontend
            #ecr_repo: crdc-gen-frontend
            #dockerfile: frontend/Dockerfile
            #context: frontend

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          submodules: true

      - name: Set image name
        run: |
          IMAGE_NAME="${{ secrets.AWS_ECR_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/${{ matrix.ecr_repo }}:${{ env.IMAGE_TAG }}"
          echo "IMAGE_NAME=$IMAGE_NAME" >> "$GITHUB_ENV"

      - name: Build Docker Image
        run: |
          docker build --no-cache \
            -t $IMAGE_NAME \
            -f ${{ matrix.dockerfile }} \
            ${{ matrix.context }}

      - name: Run Trivy Scan
        if: ${{ inputs.trivy_scan == true }}
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
          echo "========================================"
          echo "Scanning: $IMAGE_NAME"
          echo "========================================"
          trivy image \
            --exit-code 1 \
            --severity CRITICAL,HIGH \
            --no-progress \
            --format table \
            "$IMAGE_NAME"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ secrets.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_BUILD_ROLE_TO_ASSUME }}

      - name: Login to Amazon ECR
        run: |
          REGISTRY_URL="${{ secrets.AWS_ECR_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com"
          aws ecr get-login-password --region $REGION | docker login --username AWS --password-stdin $REGISTRY_URL

      - name: Push Image to ECR
        run: |
          echo "Pushing: $IMAGE_NAME"
          docker push $IMAGE_NAME

  # ──────────────────────────────────────────────
  # Job 3: Mirror external Neo4j image into ECR
  # ──────────────────────────────────────────────
  mirror_neo4j:
    name: Mirror Neo4j Image to ECR
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      NEO4J_SOURCE_IMAGE: docker.io/library/neo4j:${{ inputs.neo4j_version }}
      NEO4J_ECR_REPOSITORY: crdc-mdb-sts-fast-api
      NEO4J_IMAGE_TAG: neo4j-${{ inputs.neo4j_version }}
      REGION: ${{ secrets.AWS_REGION }}
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ secrets.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_BUILD_ROLE_TO_ASSUME }}

      - name: Set Neo4j ECR image name
        run: |
          NEO4J_ECR_IMAGE="${{ secrets.AWS_ECR_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/${NEO4J_ECR_REPOSITORY}:${NEO4J_IMAGE_TAG}"
          echo "NEO4J_ECR_IMAGE=$NEO4J_ECR_IMAGE" >> "$GITHUB_ENV"

      - name: Check whether Neo4j image already exists in ECR
        id: check_neo4j_image
        run: |
          if aws ecr describe-images \
            --region "$REGION" \
            --repository-name "$NEO4J_ECR_REPOSITORY" \
            --image-ids imageTag="$NEO4J_IMAGE_TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Neo4j image already exists in ECR: ${NEO4J_ECR_REPOSITORY}:${NEO4J_IMAGE_TAG}"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Neo4j image not found in ECR: ${NEO4J_ECR_REPOSITORY}:${NEO4J_IMAGE_TAG}"
          fi

      - name: Login to Amazon ECR
        if: steps.check_neo4j_image.outputs.exists != 'true'
        run: |
          REGISTRY_URL="${{ secrets.AWS_ECR_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com"
          aws ecr get-login-password --region "$REGION" | docker login --username AWS --password-stdin "$REGISTRY_URL"

      - name: Pull and push Neo4j image to ECR
        if: steps.check_neo4j_image.outputs.exists != 'true'
        run: |
          docker pull "$NEO4J_SOURCE_IMAGE"
          docker tag "$NEO4J_SOURCE_IMAGE" "$NEO4J_ECR_IMAGE"
          docker push "$NEO4J_ECR_IMAGE"

  # ──────────────────────────────────────────────
  # Job 4: Run Twistlock once for all prepared images
  # ──────────────────────────────────────────────
  twistlock_scan:
    name: Run Twistlock Scan
    runs-on: ubuntu-latest
    needs: [prepare, build, mirror_neo4j]
    if: ${{ inputs.twistlock_scan == true }}
    environment: ${{ inputs.environment }}
    env:
      IMAGE_TAG: ${{ needs.prepare.outputs.image_tag }}
      BACKEND_ECR_REPOSITORY: crdc-mdb-sts-fast-api
      NEO4J_IMAGE_TAG: neo4j-${{ inputs.neo4j_version }}
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.5.10"

      - name: Install Prefect CLI
        run: uv pip install --system "prefect==3.3.4" "importlib-metadata>=8,<9"

      - name: Run Twistlock scan deployment
        env:
          PREFECT_API_KEY: ${{ secrets.PREFECT_API_KEY }}
          PREFECT_API_URL: ${{ secrets.PREFECT_API_URL_C1 }}
          TWISTLOCK_ADDRESS: ${{ inputs.twistlock_address }}
        run: |
          set -euo pipefail
          BACKEND_IMAGE_REF="${{ secrets.AWS_ECR_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/${BACKEND_ECR_REPOSITORY}:${IMAGE_TAG}"
          NEO4J_IMAGE_REF="${{ secrets.AWS_ECR_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/${BACKEND_ECR_REPOSITORY}:${NEO4J_IMAGE_TAG}"
          if [ -n "${TWISTLOCK_ADDRESS:-}" ]; then
            PARAMS=$(jq -n \
              --arg backend_image_ref "$BACKEND_IMAGE_REF" \
              --arg neo4j_image_ref "$NEO4J_IMAGE_REF" \
              --arg twistlock_address "$TWISTLOCK_ADDRESS" \
              '{image_ref: [$backend_image_ref, $neo4j_image_ref], twistlock_address: $twistlock_address}')
          else
            PARAMS=$(jq -n \
              --arg backend_image_ref "$BACKEND_IMAGE_REF" \
              --arg neo4j_image_ref "$NEO4J_IMAGE_REF" \
              '{image_ref: [$backend_image_ref, $neo4j_image_ref]}')
          fi
          echo "PARAMS=$PARAMS"
          uv run prefect deployment run twistlock-scan/twistlock-scan \
            --params "$PARAMS" \
            --watch \
            --watch-interval 30

  # ──────────────────────────────────────────────
  # Job 5: Tag the commit only after all builds pass
  # ──────────────────────────────────────────────
  #tag:
    #name: Create Git Tag
    #runs-on: ubuntu-latest
    #needs: [prepare, build]
    #steps:
      #- name: Checkout Code Repository
        #uses: actions/checkout@v4
        #with:
          #ref: ${{ github.ref_name }}

      #- name: Create and push git tag
        #run: |
          #git config user.name "GitHub Actions"
          #git config user.email "github-actions@users.noreply.github.com"
          #git tag ${{ needs.prepare.outputs.image_tag }}
          #git push origin ${{ needs.prepare.outputs.image_tag }}

  # ──────────────────────────────────────────────
  # Job 6: Slack notification (always runs)
  # ──────────────────────────────────────────────
  notify:
    name: Slack Notification
    runs-on: ubuntu-latest
    needs: [build, mirror_neo4j]
    if: always()
    steps:
      - name: Slack Notification
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        uses: act10ns/slack@87c73aef9f8838eb6feae81589a6b1487a4a9e08  # v1.6.0
        with:
          status: ${{ needs.build.result }}
